<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeusOps | Operations Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0A0A12;
      --bg-secondary: #0D0D1A;
      --bg-panel: #0F0F1F;
      --cyan: #00D4FF;
      --cyan-dim: #004D5C;
      --amber: #FFB000;
      --red: #FF0040;
      --green: #00FF88;
      --text-primary: #E0F4FF;
      --text-dim: #4A7A8A;
      --border: #1A2A3A;
      --glow-cyan: 0 0 8px #00D4FF, 0 0 16px rgba(0,212,255,0.3);
      --glow-amber: 0 0 8px #FFB000, 0 0 16px rgba(255,176,0,0.3);
      --glow-red: 0 0 8px #FF0040, 0 0 16px rgba(255,0,64,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-primary);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #dashboard {
      width: 100%;
      height: 100%;
      display: block;
    }

    .heading {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
    }

    .data {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0% { r: 20; opacity: 0.8; }
      100% { r: 28; opacity: 0; }
    }

    /* Smooth transitions for command bar updates */
    #commandBar text, #commandBar circle, #commandBar rect {
      transition: fill 0.3s ease, stroke 0.3s ease, opacity 0.3s ease;
    }

    /* Agent tile glow intensity classes */
    .glow-hot {
      filter: drop-shadow(0 0 8px #00D4FF) drop-shadow(0 0 16px rgba(0,212,255,0.6));
    }
    .glow-warm {
      filter: drop-shadow(0 0 4px rgba(0,212,255,0.3));
    }
    .glow-dim {
      filter: none;
      opacity: 0.5;
    }

    /* Agent tile smooth transitions */
    .agent-tile use, .agent-tile circle, .agent-tile text, .agent-tile rect, .agent-tile line {
      transition: fill 0.3s ease, stroke 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
    }
  </style>
</head>
<body>
  <svg id="dashboard" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet">
    <defs>
      <!-- TRON-style gradients and filters -->
      <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:var(--cyan);stop-opacity:0.6" />
        <stop offset="100%" style="stop-color:var(--cyan);stop-opacity:0.1" />
      </linearGradient>

      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>

      <!-- Hexagon path for agent tiles -->
      <path id="hexagon" d="M 30,0 L 60,15 L 60,45 L 30,60 L 0,45 L 0,15 Z" />
    </defs>

    <!-- Background -->
    <rect width="1400" height="900" fill="var(--bg-primary)" />

    <!-- Grid lines (subtle) -->
    <g opacity="0.1">
      <line x1="0" y1="80" x2="1400" y2="80" stroke="var(--cyan)" stroke-width="1"/>
      <line x1="0" y1="780" x2="1400" y2="780" stroke="var(--cyan)" stroke-width="1"/>
      <line x1="770" y1="80" x2="770" y2="780" stroke="var(--cyan)" stroke-width="1"/>
    </g>

    <!-- ZONE A: COMMAND BAR (0, 0, 1400, 80) -->
    <g id="commandBar">
      <rect x="0" y="0" width="1400" height="80" fill="var(--bg-secondary)" stroke="var(--border)" stroke-width="2"/>

      <!-- Panel 1: System Pulse (0-280) -->
      <g id="systemPulse">
        <line x1="280" y1="10" x2="280" y2="70" stroke="var(--cyan-dim)" stroke-width="1"/>

        <!-- Pulsing ring -->
        <circle cx="80" cy="40" r="22" fill="none" stroke="var(--cyan)" stroke-width="2" opacity="0.3"/>
        <circle cx="80" cy="40" r="20" fill="none" stroke="var(--cyan)" stroke-width="3" filter="url(#glow)">
          <animate attributeName="r" values="20;28;20" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="40" r="18" fill="var(--bg-panel)" stroke="var(--cyan)" stroke-width="2"/>

        <text x="80" y="48" text-anchor="middle" class="data" fill="var(--cyan)" font-size="20">87</text>
        <text x="140" y="35" class="heading" fill="var(--text-dim)" font-size="10">SYSTEM</text>
        <text x="140" y="50" class="heading" fill="var(--text-dim)" font-size="10">HEALTH</text>
      </g>

      <!-- Panel 2: CI Status (280-560) -->
      <g id="ciStatus">
        <line x1="560" y1="10" x2="560" y2="70" stroke="var(--cyan-dim)" stroke-width="1"/>
        <text x="300" y="25" class="heading" fill="var(--text-dim)" font-size="10">CI STATUS</text>

        <!-- 10 status segments -->
        <g id="ciSegments">
          <rect x="300" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="322" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="344" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="366" y="35" width="18" height="28" fill="var(--red)" opacity="0.8"/>
          <rect x="388" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="410" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="432" y="35" width="18" height="28" fill="var(--red)" opacity="0.8"/>
          <rect x="454" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="476" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
          <rect x="498" y="35" width="18" height="28" fill="var(--green)" opacity="0.8"/>
        </g>
      </g>

      <!-- Panel 3: PR Velocity (560-840) -->
      <g id="prVelocity">
        <line x1="840" y1="10" x2="840" y2="70" stroke="var(--cyan-dim)" stroke-width="1"/>
        <text x="580" y="25" class="heading" fill="var(--text-dim)" font-size="10">PR VELOCITY</text>
        <!-- Dynamic content populated by renderCommandBar() -->
      </g>

      <!-- Panel 4: Pipeline Flow (840-1120) -->
      <g id="pipelineSummary">
        <line x1="1120" y1="10" x2="1120" y2="70" stroke="var(--cyan-dim)" stroke-width="1"/>
        <text x="860" y="25" class="heading" fill="var(--text-dim)" font-size="10">PIPELINE</text>
        <!-- Dynamic bars populated by renderCommandBar() -->
      </g>

      <!-- Panel 5: Alert Zone (1120-1400) -->
      <g id="alertZone">
        <text x="1140" y="25" class="heading" fill="var(--text-dim)" font-size="10">ALERTS</text>
        <text x="1140" y="50" class="data" fill="var(--text-dim)" font-size="18" id="alertCount">0 ALERTS</text>
      </g>

      <!-- Connection Status Indicator (top-right) -->
      <g id="connectionStatus">
        <circle cx="1360" cy="20" r="6" id="statusDot" fill="var(--red)" class="pulse"/>
        <text x="1360" y="45" text-anchor="middle" id="statusText" fill="var(--red)" font-size="9">OFFLINE</text>
      </g>
    </g>

    <!-- ZONE B: TOOL STREAM SIDEBAR (0, 80, 120, 820) -->
    <g id="toolStream">
      <rect x="0" y="80" width="120" height="820" fill="var(--bg-secondary)" stroke="none"/>
      <line x1="120" y1="80" x2="120" y2="900" stroke="var(--cyan)" stroke-width="1" opacity="0.2"/>
      <text x="60" y="100" class="heading" fill="var(--cyan)" font-size="9" text-anchor="middle">TOOLS</text>

      <!-- Tool entries container -->
      <g id="tool-sidebar-entries"></g>
    </g>

    <!-- ZONE C: AGENT GRID (120, 80, 560, 820) -->

      <text x="140" y="105" class="heading" fill="var(--cyan)" font-size="14">AGENT GRID</text>

          <circle class="status-dot" cx="8" cy="52" r="3" fill="var(--red)"/>

          <text class="agent-task" x="30" y="60" text-anchor="middle" fill="var(--text-dim)" font-size="6" font-style="italic" opacity="0.7"></text>

        <g id="tile-pm" class="agent-tile" data-agent="pm" transform="translate(470, 430)">
          <use href="#hexagon" fill="var(--bg-secondary)" stroke="var(--cyan-dim)" stroke-width="2"/>
          <circle class="perf-badge" cx="50" cy="15" r="3" fill="var(--green)"/>

        <g id="mc-gateway-strip" transform="translate(0, 750)">

          <line x1="140" y1="0" x2="660" y2="0" stroke="#9B59B6" stroke-width="1" opacity="0.5"/>

          <!-- Label -->
          <text x="140" y="18" font-family="Orbitron" font-size="8" fill="#9B59B6">MC GATEWAY</text>

          <!-- Status indicators for MC agents -->
          <g id="mc-indicators" transform="translate(140, 35)">
            <!-- MC (main) -->
            <g transform="translate(0, 0)">
              <circle id="mc-dot-main" cx="0" cy="0" r="4" fill="#FF0040"/>
              <text id="mc-label-main" x="0" y="18" text-anchor="middle" font-family="Share Tech Mono" font-size="7" fill="var(--text-dim)">MC</text>
            </g>

            <!-- ZEUS⚡ -->
            <g transform="translate(120, 0)">
              <circle id="mc-dot-zeus" cx="0" cy="0" r="4" fill="#FF0040"/>
              <text id="mc-label-zeus" x="0" y="18" text-anchor="middle" font-family="Share Tech Mono" font-size="7" fill="var(--text-dim)">ZEUS⚡</text>
            </g>

            <!-- TRAVIS -->
            <g transform="translate(240, 0)">
              <circle id="mc-dot-mctravis" cx="0" cy="0" r="4" fill="#FF0040"/>
              <text id="mc-label-mctravis" x="0" y="18" text-anchor="middle" font-family="Share Tech Mono" font-size="7" fill="var(--text-dim)">TRAVIS</text>
            </g>

            <!-- OBR -->
            <g transform="translate(360, 0)">
              <circle id="mc-dot-obr" cx="0" cy="0" r="4" fill="#FF0040"/>
              <text id="mc-label-obr" x="0" y="18" text-anchor="middle" font-family="Share Tech Mono" font-size="7" fill="var(--text-dim)">OBR</text>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- ZONE D: ACTIVITY STREAM (680, 80, 280, 820) -->
    <g id="activity-stream-zone">
      <rect x="680" y="80" width="280" height="820" fill="var(--bg-panel)"/>
      <line x1="680" y1="80" x2="680" y2="900" stroke="var(--cyan)" stroke-width="1" opacity="0.3"/>
      <line x1="960" y1="80" x2="960" y2="900" stroke="var(--cyan)" stroke-width="1" opacity="0.3"/>
      <text x="690" y="100" font-family="Orbitron" font-size="9" fill="var(--cyan)">ACTIVITY</text>

      <!-- Vertical event cards container -->
      <g id="eventCards"></g>
    </g>

    <!-- ZONE E: FLYWHEEL (960, 80, 440, 820) -->
    <g id="flywheel">
      <rect x="960" y="80" width="440" height="820" fill="var(--bg-panel)" stroke="var(--border)" stroke-width="1"/>
      <text x="980" y="105" class="heading" fill="var(--cyan)" font-size="14">PIPELINE FLOW</text>
      <!-- Decorative underline -->
      <line x1="980" y1="110" x2="1110" y2="110" stroke="var(--cyan)" stroke-width="1" opacity="0.5"/>

      <!-- Vertical pipeline visualization (dynamically built) -->
      <g id="flywheel-zone"></g>
    </g>
  </svg>

  <script>
    // ============================================================================
    // DASHBOARD STATE STORE
    // ============================================================================
    const DashboardState = {
      agents: {},        // agent_id → {status, lastSeen, currentJob, successRate, contextPct}
      agentStats: {},    // agent_id → {done7d, failed7d, lastResult, lastTask, runningJob}
      toolCalls: {},     // agent_id → [recent tool calls]
      metrics: {
        healthScore: 0,
        ci: { passRate1h: 0, lastRuns: [], repos: {} },
        pr: { opened24h: 0, merged24h: 0 },
        pipeline: { backlog: 0, design: 0, code: 0, review: 0, done: 0 },
        jobs: { completed24h: 0, successRate: 0 },
        alerts: { active: 0, escalations: [] }
      },
      events: [],        // ring buffer, max 100
      connected: false,
      lastUpdate: null
    };

    // ============================================================================
    // HEALTH SCORE COMPUTATION
    // ============================================================================
    function computeHealthScore(state) {
      const agents = Object.values(state.agents);
      const total = agents.length || 1;
      const active = agents.filter(a => a.status === "active").length;
      const agentScore = active / total;

      const runs = state.metrics.ci.lastRuns.slice(-10);
      const ciScore = runs.length ? runs.filter(r => r === "success").length / runs.length : 1;

      const jobs = state.metrics.jobs;
      const jobScore = jobs.completed24h > 0 ? jobs.successRate : 1;

      const alerts = state.metrics.alerts.active;
      const alertScore = alerts === 0 ? 1 : Math.max(0, 1 - (alerts * 0.25));

      return Math.round((agentScore * 0.20 + ciScore * 0.30 + jobScore * 0.25 + alertScore * 0.25) * 100);
    }

    // ============================================================================
    // COMMAND BAR RENDERING
    // ============================================================================
    function renderCommandBar() {
      const state = DashboardState;
      const health = state.metrics.healthScore;

      // Panel 1: System Health
      const healthText = document.querySelector('#systemPulse text.data');
      const healthRing = document.querySelector('#systemPulse circle[r="18"]');
      const healthPulse = document.querySelector('#systemPulse circle[stroke-width="3"]');

      if (healthText) healthText.textContent = health;

      // Update health color based on score
      let healthColor = 'var(--green)';
      if (health < 60) healthColor = 'var(--red)';
      else if (health < 80) healthColor = 'var(--amber)';

      if (healthText) healthText.setAttribute('fill', healthColor);
      if (healthRing) healthRing.setAttribute('stroke', healthColor);
      if (healthPulse) healthPulse.setAttribute('stroke', healthColor);

      // Panel 2: CI Status
      const ciRuns = state.metrics.ci.lastRuns.slice(-10);
      const ciSegments = document.querySelectorAll('#ciSegments rect');

      ciSegments.forEach((seg, i) => {
        if (i < ciRuns.length) {
          const status = ciRuns[ciRuns.length - 1 - i]; // Reverse order (newest first)
          let color = 'var(--text-dim)';
          let opacity = '0.2';

          if (status === 'success') {
            color = 'var(--green)';
            opacity = '0.8';
          } else if (status === 'failure') {
            color = 'var(--red)';
            opacity = '0.8';
          }

          seg.setAttribute('fill', color);
          seg.setAttribute('opacity', opacity);
        } else {
          seg.setAttribute('fill', 'var(--text-dim)');
          seg.setAttribute('opacity', '0.2');
        }
      });

      // Add pass rate text if not exists
      let ciPassRateText = document.getElementById('ciPassRate');
      if (!ciPassRateText && ciRuns.length > 0) {
        ciPassRateText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        ciPassRateText.setAttribute('id', 'ciPassRate');
        ciPassRateText.setAttribute('x', '410');
        ciPassRateText.setAttribute('y', '70');
        ciPassRateText.setAttribute('text-anchor', 'middle');
        ciPassRateText.setAttribute('fill', 'var(--text-dim)');
        ciPassRateText.setAttribute('font-size', '9');
        ciPassRateText.classList.add('data');
        document.getElementById('ciStatus').appendChild(ciPassRateText);
      }

      if (ciPassRateText && ciRuns.length > 0) {
        const passCount = ciRuns.filter(r => r === 'success').length;
        const passRate = Math.round((passCount / ciRuns.length) * 100);
        ciPassRateText.textContent = `${passRate}% (24h)`;
      }

      // Panel 3: PR Velocity
      const prOpened = state.metrics.pr.opened24h;
      const prMerged = state.metrics.pr.merged24h;
      const mergeRate = prOpened > 0 ? Math.round((prMerged / prOpened) * 100) : 0;

      let prOpenedText = document.getElementById('prOpenedText');
      let prMergedText = document.getElementById('prMergedText');
      let prMergeRateText = document.getElementById('prMergeRate');

      if (!prOpenedText) {
        // Create PR velocity texts
        const prVelocity = document.getElementById('prVelocity');

        prOpenedText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        prOpenedText.setAttribute('id', 'prOpenedText');
        prOpenedText.setAttribute('x', '580');
        prOpenedText.setAttribute('y', '45');
        prOpenedText.setAttribute('fill', 'var(--green)');
        prOpenedText.setAttribute('font-size', '14');
        prOpenedText.classList.add('data');
        prVelocity.appendChild(prOpenedText);

        prMergedText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        prMergedText.setAttribute('id', 'prMergedText');
        prMergedText.setAttribute('x', '700');
        prMergedText.setAttribute('y', '45');
        prMergedText.setAttribute('fill', 'var(--cyan)');
        prMergedText.setAttribute('font-size', '14');
        prMergedText.classList.add('data');
        prVelocity.appendChild(prMergedText);

        prMergeRateText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        prMergeRateText.setAttribute('id', 'prMergeRate');
        prMergeRateText.setAttribute('x', '640');
        prMergeRateText.setAttribute('y', '65');
        prMergeRateText.setAttribute('fill', 'var(--text-dim)');
        prMergeRateText.setAttribute('font-size', '9');
        prMergeRateText.classList.add('data');
        prVelocity.appendChild(prMergeRateText);
      }

      if (prOpenedText) prOpenedText.textContent = `↑${prOpened} opened`;
      if (prMergedText) prMergedText.textContent = `←${prMerged} merged`;
      if (prMergeRateText) prMergeRateText.textContent = `${mergeRate}% merge rate`;

      // Panel 4: Pipeline - Mini horizontal bars
      const pipeline = state.metrics.pipeline;
      const maxCount = Math.max(pipeline.backlog, pipeline.design, pipeline.code, pipeline.review, pipeline.done, 1);

      // Clear existing pipeline bars and recreate
      const pipelineSummary = document.getElementById('pipelineSummary');
      const existingBars = pipelineSummary.querySelectorAll('.pipeline-bar, .pipeline-label');
      existingBars.forEach(el => el.remove());

      const stages = [
        { key: 'backlog', label: 'BL', x: 860 },
        { key: 'design', label: 'DS', x: 910 },
        { key: 'code', label: 'CD', x: 960 },
        { key: 'review', label: 'RV', x: 1010 },
        { key: 'done', label: 'DN', x: 1060 }
      ];

      stages.forEach((stage, i) => {
        const count = pipeline[stage.key] || 0;
        const height = Math.max(4, (count / maxCount) * 30);
        const y = 60 - height;

        // Check if bottleneck (>2x next stage)
        const nextStage = stages[i + 1];
        const nextCount = nextStage ? (pipeline[nextStage.key] || 0) : count;
        const isBottleneck = count > nextCount * 2;

        const color = isBottleneck ? 'var(--amber)' : 'var(--cyan)';

        // Bar
        const bar = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        bar.setAttribute('class', 'pipeline-bar');
        bar.setAttribute('x', stage.x);
        bar.setAttribute('y', y);
        bar.setAttribute('width', '36');
        bar.setAttribute('height', height);
        bar.setAttribute('fill', color);
        bar.setAttribute('opacity', '0.7');
        bar.style.transition = 'all 0.3s ease';
        pipelineSummary.appendChild(bar);

        // Label
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'pipeline-label');
        label.setAttribute('x', stage.x + 18);
        label.setAttribute('y', '72');
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('fill', 'var(--text-dim)');
        label.setAttribute('font-size', '8');
        label.textContent = count;
        pipelineSummary.appendChild(label);
      });

      // Panel 5: Alerts
      const alertCount = state.metrics.alerts.active;
      const alertText = document.getElementById('alertCount');

      if (alertText) {
        if (alertCount === 0) {
          alertText.textContent = '0 CLEAR';
          alertText.setAttribute('fill', 'var(--text-dim)');
        } else {
          alertText.textContent = `${alertCount} ALERT${alertCount > 1 ? 'S' : ''}`;
          alertText.setAttribute('fill', 'var(--red)');
          alertText.classList.add('pulse');
        }
      }

      // Update connection indicator
      updateConnectionIndicator();
    }

    // ============================================================================
    // CONNECTION STATUS INDICATOR
    // ============================================================================
    function updateConnectionIndicator() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');

      if (DashboardState.connected) {
        dot.setAttribute('fill', 'var(--green)');
        text.setAttribute('fill', 'var(--green)');
        text.textContent = 'LIVE';
        dot.classList.remove('pulse');
      } else {
        dot.setAttribute('fill', 'var(--red)');
        text.setAttribute('fill', 'var(--red)');
        text.textContent = 'OFFLINE';
        dot.classList.add('pulse');
      }
    }

    // ============================================================================
    // AGENT GRID RENDERING
    // ============================================================================
    function renderAgentGrid() {
      // Iterate through all agent tiles
      const tiles = document.querySelectorAll('.agent-tile[data-agent]');

      tiles.forEach(tile => {
        const agentId = tile.getAttribute('data-agent');
        const agent = DashboardState.agents[agentId];
        const stats = DashboardState.agentStats[agentId];
        const tools = DashboardState.toolCalls[agentId] || [];

        // Get tile elements
        const hexagon = tile.querySelector('use');
        const statusDot = tile.querySelector('.status-dot');
        const statusText = tile.querySelector('.agent-status');
        const taskText = tile.querySelector('.agent-task');
        const contextBar = tile.querySelector('.context-bar');
        const perfBadge = tile.querySelector('.perf-badge');

        // Default to offline if no agent data
        if (!agent) {
          tile.classList.remove('glow-hot', 'glow-warm');
          tile.classList.add('glow-dim');
          if (statusDot) statusDot.setAttribute('fill', 'var(--red)');
          if (statusText) {
            statusText.textContent = 'OFFLINE';
            statusText.setAttribute('fill', 'var(--red)');
          }
          if (taskText) taskText.textContent = '';
          if (contextBar) contextBar.setAttribute('opacity', '0');
          if (perfBadge) perfBadge.setAttribute('fill', 'var(--green)'); // Assume healthy if no data
          return;
        }

        // 1. Update glow intensity based on status
        tile.classList.remove('glow-hot', 'glow-warm', 'glow-dim');
        if (agent.status === 'active') {
          tile.classList.add('glow-hot');
        } else if (agent.status === 'idle') {
          tile.classList.add('glow-warm');
        } else {
          tile.classList.add('glow-dim');
        }

        // 2. Update status dot color
        let statusColor = 'var(--red)';
        let statusLabel = 'OFFLINE';
        if (agent.status === 'active') {
          statusColor = 'var(--green)';
          statusLabel = 'ACTIVE';
        } else if (agent.status === 'idle') {
          statusColor = 'var(--amber)';
          statusLabel = 'IDLE';
        }
        if (statusDot) statusDot.setAttribute('fill', statusColor);
        if (statusText) {
          statusText.textContent = statusLabel;
          statusText.setAttribute('fill', statusColor);
        }

        // 3. Update performance badge
        if (stats && perfBadge) {
          const totalJobs = (stats.done7d || 0) + (stats.failed7d || 0);
          const successRate = totalJobs > 0 ? stats.done7d / totalJobs : 1.0;

          let badgeColor = 'var(--green)';
          if (successRate < 0.7) badgeColor = 'var(--red)';
          else if (successRate < 0.9) badgeColor = 'var(--amber)';

          perfBadge.setAttribute('fill', badgeColor);
        } else if (perfBadge) {
          perfBadge.setAttribute('fill', 'var(--green)'); // Default to green if no data
        }

        // 4. Update current task
        if (taskText && stats && stats.runningJob) {
          let task = stats.runningJob.task_summary || '';
          if (task.length > 22) task = task.substring(0, 22) + '...';
          taskText.textContent = task;
        } else if (taskText) {
          taskText.textContent = '';
        }

        // 5. Update context bar
        if (contextBar && agent.contextPct > 5) {
          const pct = Math.min(100, agent.contextPct);
          const barWidth = (pct / 100) * 50; // Max width 50px (roughly the width of hexagon)

          let barColor = 'var(--cyan)';
          if (pct >= 90) barColor = 'var(--red)';
          else if (pct >= 70) barColor = 'var(--amber)';

          contextBar.setAttribute('x2', (5 + barWidth).toString());
          contextBar.setAttribute('stroke', barColor);
          contextBar.setAttribute('opacity', '0.8');
        } else if (contextBar) {
          contextBar.setAttribute('opacity', '0');
        }
      });

      // Update MC gateway strip
      const mcAgents = [
        {id: "main", label: "MC"},
        {id: "zeus", label: "ZEUS⚡"},
        {id: "mctravis", label: "TRAVIS"},
        {id: "obr", label: "OBR"}
      ];
      for (const mc of mcAgents) {
        const dot = document.getElementById(`mc-dot-${mc.id}`);
        const agent = DashboardState.agents[mc.id];
        if (dot && agent) {
          const color = agent.status === "active" ? "var(--green)" : agent.status === "idle" ? "var(--amber)" : "var(--red)";
          dot.setAttribute("fill", color);
        }
      }
    }

    // ============================================================================
    // TOOL STREAM SIDEBAR
    // ============================================================================
    function renderToolSidebar() {
      const container = document.getElementById("tool-sidebar-entries");
      if (!container) return;

      // Get all tool calls across all agents, sorted newest first
      const allCalls = [];
      for (const [agentId, calls] of Object.entries(DashboardState.toolCalls || {})) {
        for (const call of calls) {
          allCalls.push({...call, agentId});
        }
      }
      allCalls.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      const recent = allCalls.slice(0, 8);

      container.innerHTML = "";

      if (recent.length === 0) {
        const noActivity = document.createElementNS("http://www.w3.org/2000/svg", "text");
        noActivity.setAttribute("x", "60");
        noActivity.setAttribute("y", "200");
        noActivity.setAttribute("text-anchor", "middle");
        noActivity.setAttribute("fill", "var(--text-dim)");
        noActivity.setAttribute("font-size", "8");
        noActivity.setAttribute("font-family", "Share Tech Mono, monospace");
        noActivity.textContent = "NO ACTIVITY";
        container.appendChild(noActivity);
        return;
      }

      recent.forEach((call, i) => {
        const y = 115 + (i * 90);
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");

        // Agent name
        const agentText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        agentText.setAttribute("x", "8"); agentText.setAttribute("y", String(y));
        agentText.setAttribute("fill", "var(--text-dim)"); agentText.setAttribute("font-size", "7");
        agentText.setAttribute("font-family", "Share Tech Mono, monospace");
        agentText.textContent = call.agentId?.toUpperCase().slice(0,10) || "?";
        g.appendChild(agentText);

        // Tool name
        const toolText = document.createElementNS("http://www.w3.org/2000/svg", "text");
        toolText.setAttribute("x", "8"); toolText.setAttribute("y", String(y + 12));
        toolText.setAttribute("fill", "var(--cyan)"); toolText.setAttribute("font-size", "9");
        toolText.setAttribute("font-weight", "bold");
        toolText.setAttribute("font-family", "Share Tech Mono, monospace");
        toolText.textContent = call.tool?.slice(0, 12) || "?";
        g.appendChild(toolText);

        // Summary line 1
        const sum1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        sum1.setAttribute("x", "8"); sum1.setAttribute("y", String(y + 24));
        sum1.setAttribute("fill", "var(--text-primary)"); sum1.setAttribute("font-size", "8");
        sum1.setAttribute("font-family", "Share Tech Mono, monospace");
        sum1.textContent = (call.summary || "").slice(0, 14);
        g.appendChild(sum1);

        // Summary line 2
        if ((call.summary || "").length > 14) {
          const sum2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
          sum2.setAttribute("x", "8"); sum2.setAttribute("y", String(y + 34));
          sum2.setAttribute("fill", "var(--text-primary)"); sum2.setAttribute("font-size", "8");
          sum2.setAttribute("font-family", "Share Tech Mono, monospace");
          sum2.textContent = (call.summary || "").slice(14, 28);
          g.appendChild(sum2);
        }

        // Separator line
        const sep = document.createElementNS("http://www.w3.org/2000/svg", "line");
        sep.setAttribute("x1", "4"); sep.setAttribute("y1", String(y + 44));
        sep.setAttribute("x2", "116"); sep.setAttribute("y2", String(y + 44));
        sep.setAttribute("stroke", "var(--border)"); sep.setAttribute("stroke-width", "0.5");
        g.appendChild(sep);

        container.appendChild(g);
      });
    }

    // ============================================================================
    // EVENT STREAM HANDLING
    // ============================================================================
    let eventCardCount = 0;

    // Event type configuration
    const EVENT_TYPES = {
      dispatch: { color: '#00D4FF', label: 'DISPATCH' },
      agent_checkpoint: { color: '#00FF88', label: 'CHECKPOINT' },
      ci_check: { color: '#00FF88', label: 'CI ✓' }, // Will be overridden based on context
      pr_event: { color: '#7B68EE', label: 'PR' },
      trello_update: { color: '#00D4FF', label: 'TRELLO' },
      deploy: { color: '#00FF88', label: 'DEPLOY' },
      heartbeat: { color: '#4A7A8A', label: 'HEARTBEAT' },
      escalation: { color: '#FF0040', label: 'ESCALATION' },
      sre_alert: { color: '#FFB000', label: 'SRE ALERT' },
      tool_call: { color: '#4A7A8A', label: 'TOOL' },
      system: { color: '#4A7A8A', label: 'SYSTEM' }
    };

    function appendToEventStream(event) {
      // Add to ring buffer
      DashboardState.events.push(event);
      if (DashboardState.events.length > 100) {
        DashboardState.events.shift();
      }

      if (!event) return;

      const record = event.record || event;
      const actionType = record.action_type || 'system';
      const description = record.description || record.task_summary || 'Event';
      const created = record.created || new Date().toISOString();

      // Parse context
      let context = {};
      try {
        context = typeof record.context === "string" ? JSON.parse(record.context || "{}") : (record.context || {});
      } catch (e) {
        context = {};
      }

      // Determine event type config
      let typeConfig = EVENT_TYPES[actionType] || EVENT_TYPES.system;

      // Special handling for ci_check
      if (actionType === 'ci_check') {
        if (context.result === 'failure' || context.result === 'failed') {
          typeConfig = { color: '#FF0040', label: 'CI ✗' };
        } else {
          typeConfig = { color: '#00FF88', label: 'CI ✓' };
        }
      }

      // Determine if critical (for glow effect)
      const isCritical = actionType === 'escalation' || actionType === 'sre_alert';

      // Extract time
      const time = new Date(created).toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      // Truncate description to fit in card
      const maxLength = 28;
      const truncatedDesc = description.length > maxLength
        ? description.substring(0, maxLength - 3) + '...'
        : description;

      // Create card (pass full event record for modal)
      createEventCard(typeConfig, time, truncatedDesc, isCritical, record);
    }

    function createEventCard(typeConfig, time, description, isCritical, eventRecord) {
      const container = document.getElementById('eventCards');
      if (!container) return;

      // Clear container and rebuild from DashboardState.events (last 10)
      container.innerHTML = '';

      const recentEvents = DashboardState.events.slice(-10).reverse(); // newest first

      recentEvents.forEach((evt, index) => {
        const evtRecord = evt.record || evt;
        const actionType = evtRecord.action_type || 'system';
        const evtDescription = evtRecord.description || evtRecord.task_summary || 'Event';
        const created = evtRecord.created || new Date().toISOString();

        // Parse context
        let context = {};
        try {
          context = typeof evtRecord.context === "string" ? JSON.parse(evtRecord.context || "{}") : (evtRecord.context || {});
        } catch (e) {
          context = {};
        }

        // Determine event type config
        let evtTypeConfig = EVENT_TYPES[actionType] || EVENT_TYPES.system;

        // Special handling for ci_check
        if (actionType === 'ci_check') {
          if (context.result === 'failure' || context.result === 'failed') {
            evtTypeConfig = { color: '#FF0040', label: 'CI ✗' };
          } else {
            evtTypeConfig = { color: '#00FF88', label: 'CI ✓' };
          }
        }

        ctx = { error: "Failed to parse context" };

        if (ctxY > 700) break;
      }

      modal.appendChild(panel);
    }

    // Helper function to wrap text
    function wrapText(text, maxChars) {
      const words = text.split(' ');
      const lines = [];
      let currentLine = '';

      for (const word of words) {
        if ((currentLine + word).length <= maxChars) {
          currentLine += (currentLine ? ' ' : '') + word;
        } else {
          if (currentLine) lines.push(currentLine);
          currentLine = word;
        }
      }
      if (currentLine) lines.push(currentLine);

      return lines.length > 0 ? lines : [''];
    }

    // ============================================================================
    // SSE CONNECTION
    // ============================================================================
    let eventSource = null;

    function connectSSE() {
      try {
        eventSource = new EventSource("http://" + window.location.hostname + ":8878/events/stream");

        eventSource.onopen = () => {
          console.log('[SSE] Connected');
          DashboardState.connected = true;
          updateConnectionIndicator();
          renderCommandBar();
        };

        eventSource.onmessage = (e) => {
          try {
            const event = JSON.parse(e.data);
            handleSSEEvent(event);
          } catch (err) {
            console.warn('[SSE] Failed to parse event:', err);
          }
        };

        eventSource.onerror = (err) => {
          console.warn('[SSE] Connection error:', err);
          DashboardState.connected = false;
          updateConnectionIndicator();

          if (eventSource) {
            eventSource.close();
          }

          // Reconnect after 5 seconds
          setTimeout(connectSSE, 5000);
        };
      } catch (err) {
        console.error('[SSE] Failed to connect:', err);
        setTimeout(connectSSE, 5000);
      }
    }

    function handleSSEEvent(data) {
      const record = data.record || data;
      const collection = data.collection;

      // Handle agent_jobs SSE events
      if (collection === "agent_jobs" && record.agent_name) {
        const agentId = record.agent_name;
        if (!DashboardState.agentStats[agentId]) {
          DashboardState.agentStats[agentId] = {
            done7d: 0,
            failed7d: 0,
            lastResult: null,
            lastTask: null,
            runningJob: null
          };
        }
        const stats = DashboardState.agentStats[agentId];

        if (record.status === "running") {
          stats.runningJob = record;
          stats.lastTask = record.task_summary;
        } else if (record.status === "done") {
          stats.done7d++;
          stats.lastResult = "done";
          stats.runningJob = null;
          stats.lastTask = record.task_summary;
        } else if (record.status === "failed") {
          stats.failed7d++;
          stats.lastResult = "failed";
          stats.runningJob = null;
          stats.lastTask = record.task_summary;
        }

        renderAgentGrid();
        appendToEventStream(record);
        return;
      }

      // Handle action_type based events
      if (!record || !record.action_type) {
        appendToEventStream(record);
        return;
      }

      const ctx = typeof record.context === "string"
        ? JSON.parse(record.context || "{}")
        : (record.context || {});

      switch(record.action_type) {
        case "pr_event":
          if (ctx.action === "opened") DashboardState.metrics.pr.opened24h++;
          if (ctx.action === "merged") DashboardState.metrics.pr.merged24h++;
          break;
        case "escalation":
        case "sre_alert":
          if (!ctx.resolved) DashboardState.metrics.alerts.active++;
          break;
        case "trello_update":
          // Will be handled by pollTrello() — no action needed here
          break;
      }

      // Always recompute health score and re-render command bar
      DashboardState.metrics.healthScore = computeHealthScore(DashboardState);
      renderCommandBar();
      renderFlywheel();
      appendToEventStream(record);
    }

    // TRELLO POLLING
    // ============================================================================
    async function pollTrello() {
      try {
        const r = await fetch("http://" + window.location.hostname + ":8878/trello");
        const d = await r.json();

        // Sum across all boards
        const p = {backlog:0, design:0, code:0, review:0, done:0};
        for (const board of Object.values(d.boards || {})) {
          p.backlog += board["Backlog"] || 0;
          p.design += board["Design"] || 0;
          // Code stage: multiple names across boards
          p.code += board["Code/Test"] || board["Code"] || board["🚧 In Progress"] || 0;
          // Review stage: multiple names
          p.review += board["Review"] || board["👀 Awaiting Approval"] || 0;
          p.done += board["Done"] || 0;
        }

        DashboardState.metrics.pipeline = p;
        // Store per-board breakdown for tooltip
        DashboardState.metrics.pipelineByBoard = d.boards;
        renderCommandBar();
        renderFlywheel();

        console.log('[Trello] Updated:', p);

    // ============================================================================
    // FLYWHEEL PIPELINE VISUALIZATION
    // ============================================================================

    /**
     * Detect bottlenecks in the pipeline.
     * A stage is a bottleneck if its count > 2× the count of the NEXT stage AND count > 2
     */
    function detectBottlenecks(pipeline) {
      const stages = ["backlog", "design", "code", "review", "done"];
      const bottlenecks = new Set();

      for (let i = 0; i < stages.length - 1; i++) {
        const curr = pipeline[stages[i]] || 0;
        const next = pipeline[stages[i + 1]] || 0;
        if (curr > 2 && curr > next * 2) {
          bottlenecks.add(stages[i]);
        }
      }

      return bottlenecks;
    }

    /**
     * Build the flywheel SVG structure (called once on init)
     */
    function buildFlywheel() {
      const zone = document.getElementById('flywheel-zone');
      if (!zone) return;

      const stages = [
        { key: 'backlog', label: 'BACKLOG', y: 150 },
        { key: 'design', label: 'DESIGN', y: 270 },
        { key: 'code', label: 'CODE / TEST', y: 390 },
        { key: 'review', label: 'REVIEW', y: 510 },
        { key: 'done', label: 'DONE', y: 630 }
      ];

      const centerX = 1180; // Center of flywheel zone (960 + 440/2)
      const nodeWidth = 280;
      const nodeHeight = 70;

      stages.forEach((stage, i) => {
        // Create node group
        const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        nodeGroup.setAttribute('id', `fw-node-${stage.key}`);
        nodeGroup.setAttribute('class', 'fw-node');

        // Background rectangle with gradient
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', centerX - nodeWidth / 2);
        rect.setAttribute('y', stage.y);
        rect.setAttribute('width', nodeWidth);
        rect.setAttribute('height', nodeHeight);
        rect.setAttribute('rx', '10');
        rect.setAttribute('fill', 'var(--bg-secondary)');
        rect.setAttribute('stroke', 'var(--cyan)');
        rect.setAttribute('stroke-width', '1.5');
        rect.setAttribute('filter', 'url(#glow)');
        rect.setAttribute('id', `fw-rect-${stage.key}`);
        rect.style.transition = 'stroke 0.3s ease, filter 0.3s ease';
        nodeGroup.appendChild(rect);

        // Label text
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', centerX);
        label.setAttribute('y', stage.y + 25);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('fill', 'var(--text-dim)');
        label.setAttribute('font-size', '11');
        label.setAttribute('class', 'heading');
        label.textContent = stage.label;
        nodeGroup.appendChild(label);

        // Count text
        const count = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        count.setAttribute('id', `fw-count-${stage.key}`);
        count.setAttribute('x', centerX);
        count.setAttribute('y', stage.y + 55);
        count.setAttribute('text-anchor', 'middle');
        count.setAttribute('fill', 'var(--cyan)');
        count.setAttribute('font-size', '28');
        count.setAttribute('class', 'data');
        count.textContent = '0';
        count.style.transition = 'fill 0.3s ease';
        nodeGroup.appendChild(count);

        // Bottleneck badge (hidden by default)
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        badge.setAttribute('id', `fw-badge-${stage.key}`);
        badge.setAttribute('x', centerX);
        badge.setAttribute('y', stage.y + 18);
        badge.setAttribute('text-anchor', 'middle');
        badge.setAttribute('fill', 'var(--amber)');
        badge.setAttribute('font-size', '9');
        badge.setAttribute('opacity', '0');
        badge.textContent = '⚠ BOTTLENECK';
        badge.style.transition = 'opacity 0.3s ease';
        nodeGroup.appendChild(badge);

        zone.appendChild(nodeGroup);

        // Create connecting line and particles (except for the last stage)
        if (i < stages.length - 1) {
          const nextStage = stages[i + 1];
          const y1 = stage.y + nodeHeight;
          const y2 = nextStage.y;

          // Animated dashed line
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('id', `fw-line-${stage.key}-${nextStage.key}`);
          line.setAttribute('x1', centerX);
          line.setAttribute('y1', y1);
          line.setAttribute('x2', centerX);
          line.setAttribute('y2', y2);
          line.setAttribute('stroke', 'var(--cyan)');
          line.setAttribute('stroke-width', '1.5');
          line.setAttribute('stroke-dasharray', '6,4');
          line.setAttribute('opacity', '0.6');
          line.style.transition = 'stroke 0.3s ease';

          const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
          animate.setAttribute('attributeName', 'stroke-dashoffset');
          animate.setAttribute('from', '0');
          animate.setAttribute('to', '-20');
          animate.setAttribute('dur', '1.5s');
          animate.setAttribute('repeatCount', 'indefinite');
          line.appendChild(animate);

          zone.appendChild(line);

          // Flow particles (3 circles with staggered animation)
          for (let p = 0; p < 3; p++) {
            const particle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            particle.setAttribute('id', `fw-particle-${stage.key}-${nextStage.key}-${p}`);
            particle.setAttribute('cx', centerX);
            particle.setAttribute('cy', y1);
            particle.setAttribute('r', '2.5');
            particle.setAttribute('fill', 'var(--cyan)');
            particle.setAttribute('opacity', '0.8');
            particle.style.transition = 'fill 0.3s ease';

            // Staggered animation (each particle starts 0.67s apart)
            const animY = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
            animY.setAttribute('attributeName', 'cy');
            animY.setAttribute('from', y1);
            animY.setAttribute('to', y2);
            animY.setAttribute('dur', '2s');
            animY.setAttribute('begin', `${p * 0.67}s`);
            animY.setAttribute('repeatCount', 'indefinite');
            particle.appendChild(animY);

            // Fade in/out
            const animOpacity = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
            animOpacity.setAttribute('attributeName', 'opacity');
            animOpacity.setAttribute('values', '0;0.8;0.8;0');
            animOpacity.setAttribute('keyTimes', '0;0.1;0.9;1');
            animOpacity.setAttribute('dur', '2s');
            animOpacity.setAttribute('begin', `${p * 0.67}s`);
            animOpacity.setAttribute('repeatCount', 'indefinite');
            particle.appendChild(animOpacity);

            zone.appendChild(particle);
          }
        }
      });

      console.log('[Flywheel] Built pipeline visualization');
    }

    /**
     * Render/update the flywheel with current pipeline data
     */
    function renderFlywheel() {
      const pipeline = DashboardState.metrics.pipeline;
      const bottlenecks = detectBottlenecks(pipeline);
      const stages = ["backlog", "design", "code", "review", "done"];

      stages.forEach((stage, i) => {
        const count = pipeline[stage] || 0;
        const isBottleneck = bottlenecks.has(stage);
        const isEmpty = count === 0;

        // Update count
        const countEl = document.getElementById(`fw-count-${stage}`);
        if (countEl) {
          countEl.textContent = count;

          // Color based on state
          if (stage === 'done') {
            countEl.setAttribute('fill', 'var(--green)');
          } else if (isBottleneck) {
            countEl.setAttribute('fill', 'var(--amber)');
          } else if (isEmpty) {
            countEl.setAttribute('fill', 'var(--text-dim)');
          } else {
            countEl.setAttribute('fill', 'var(--cyan)');
          }
        }

        // Update node border and glow
        const rectEl = document.getElementById(`fw-rect-${stage}`);
        if (rectEl) {
          if (stage === 'done') {
            rectEl.setAttribute('stroke', 'var(--green)');
            rectEl.style.filter = 'drop-shadow(0 0 6px var(--green))';
          } else if (isBottleneck) {
            rectEl.setAttribute('stroke', 'var(--amber)');
            rectEl.style.filter = 'drop-shadow(0 0 8px var(--amber))';
          } else if (isEmpty) {
            rectEl.setAttribute('stroke', 'var(--cyan-dim)');
            rectEl.style.filter = 'none';
          } else {
            rectEl.setAttribute('stroke', 'var(--cyan)');
            rectEl.style.filter = 'drop-shadow(0 0 4px var(--cyan))';
          }
        }

        // Update bottleneck badge
        const badgeEl = document.getElementById(`fw-badge-${stage}`);
        if (badgeEl) {
          badgeEl.setAttribute('opacity', isBottleneck ? '1' : '0');
        }

        // Update connecting lines and particles
        if (i < stages.length - 1) {
          const nextStage = stages[i + 1];
          const lineColor = isBottleneck ? 'var(--amber)' : 'var(--cyan)';

          const lineEl = document.getElementById(`fw-line-${stage}-${nextStage}`);
          if (lineEl) {
            lineEl.setAttribute('stroke', lineColor);
          }

          // Update particle colors
          for (let p = 0; p < 3; p++) {
            const particleEl = document.getElementById(`fw-particle-${stage}-${nextStage}-${p}`);
            if (particleEl) {
              particleEl.setAttribute('fill', lineColor);
            }
          }
        }
      });
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    function initDashboard() {
      console.log('[Dashboard] Initializing ZeusOps Observability Dashboard v2');

      // Set initial connection state
      updateConnectionIndicator();

      // Build flywheel visualization structure
      buildFlywheel();

      // Initial agent grid render with default states
      renderAgentGrid();
      renderToolStream();

      // Initial data poll before SSE connection
      pollCI();
      pollTrello();
      pollAgentData();
      pollTools();

      // Seed activity stream from recent events
      seedActivityStream();

      // Start SSE connection
      connectSSE();

      // Start polling
      setInterval(pollAgentData, 5000);
      setInterval(pollTools, 8000);
      setInterval(pollCI, 30000);
      setInterval(pollTrello, 300000); // 5 minutes

      console.log('[Dashboard] Ready');
    }

    // Start dashboard when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDashboard);
    } else {
      initDashboard();
    }
  </script>
</body>
</html>
