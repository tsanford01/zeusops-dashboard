<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeusOps | Operations Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0A0A12;
      --bg-secondary: #0D0D1A;
      --bg-panel: #0F0F1F;
      --cyan: #00D4FF;
      --cyan-dim: rgba(0,212,255,0.15);
      --amber: #FFB000;
      --red: #FF0040;
      --green: #00FF88;
      --purple: #9B59B6;
      --text-primary: #E0F4FF;
      --text-dim: #4A7A8A;
      --border: #1A2A3A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-primary);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #dashboard {
      width: 100%;
      height: 100%;
      display: block;
    }

    .heading {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
    }

    .data {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }

    .glow-hot {
      filter: drop-shadow(0 0 8px var(--green)) drop-shadow(0 0 16px rgba(0,255,136,0.3));
    }

    .glow-warm {
      filter: drop-shadow(0 0 8px var(--amber)) drop-shadow(0 0 16px rgba(255,176,0,0.3));
    }

    .glow-dim {
      filter: drop-shadow(0 0 4px var(--text-dim));
    }

    /* Activity Stream Scrollable Container */
    .activity-scroll {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px;
      background: transparent;
    }

    .activity-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .activity-scroll::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    .activity-scroll::-webkit-scrollbar-thumb {
      background: var(--cyan);
      border-radius: 3px;
    }

    .event-card {
      background: var(--bg-panel);
      border-left: 3px solid var(--cyan);
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .event-card:hover {
      background: var(--bg-secondary);
      transform: translateX(2px);
    }

    .event-card.alert-card {
      height: 110px;
      border-left-width: 3px;
    }

    .event-card.alert-red {
      border-left-color: var(--red);
      background: rgba(255, 0, 64, 0.05);
    }

    .event-card.alert-amber {
      border-left-color: var(--amber);
      background: rgba(255, 176, 0, 0.05);
    }

    .event-card.fresh-alert {
      animation: pulse 2s infinite;
    }

    .event-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      margin-right: 8px;
    }

    .event-time {
      float: right;
      font-size: 9px;
      color: var(--text-dim);
    }

    .event-desc {
      font-size: 11px;
      margin-top: 4px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .event-context {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 4px;
      font-style: italic;
    }

    /* Tool Stream Horizontal Scroll */
    .tool-scroll {
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      padding: 10px;
    }

    .tool-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .tool-scroll::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    .tool-scroll::-webkit-scrollbar-thumb {
      background: var(--cyan);
      border-radius: 3px;
    }

    .tool-card {
      display: inline-block;
      width: 200px;
      height: 85px;
      background: var(--bg-panel);
      border-left: 2px solid var(--cyan);
      border-radius: 4px;
      padding: 8px;
      margin-right: 8px;
      vertical-align: top;
    }

    .tool-agent {
      font-size: 8px;
      color: var(--text-dim);
    }

    .tool-name {
      font-size: 10px;
      color: var(--cyan);
      font-weight: bold;
      margin-top: 2px;
    }

    .tool-summary {
      font-size: 9px;
      color: var(--text-primary);
      margin-top: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tool-ts {
      font-size: 7px;
      color: var(--text-dim);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <svg id="dashboard" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet">
    <!-- Command Bar Zone (y=0-70) -->
    <g id="command-bar">
      <rect x="0" y="0" width="1400" height="70" fill="var(--bg-secondary)" />

      <!-- Panel dividers -->
      <line x1="170" y1="10" x2="170" y2="60" stroke="var(--cyan)" stroke-opacity="0.2" />
      <line x1="420" y1="10" x2="420" y2="60" stroke="var(--cyan)" stroke-opacity="0.2" />
      <line x1="650" y1="10" x2="650" y2="60" stroke="var(--cyan)" stroke-opacity="0.2" />
      <line x1="850" y1="10" x2="850" y2="60" stroke="var(--cyan)" stroke-opacity="0.2" />

      <!-- Panel 1: System Health -->
      <g id="system-health">
        <circle id="health-ring" cx="50" cy="35" r="18" fill="none" stroke="var(--green)" stroke-width="2" />
        <circle id="health-pulse" cx="50" cy="35" r="22" fill="none" stroke="var(--green)" stroke-width="3" opacity="0.5">
          <animate attributeName="r" from="22" to="26" dur="2s" repeatCount="indefinite" />
          <animate attributeName="opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite" />
        </circle>
        <text id="health-score" x="50" y="40" text-anchor="middle" class="data" font-size="16" fill="var(--green)">87</text>
        <text x="90" y="40" font-family="Orbitron" font-size="9" fill="var(--cyan)">SYSTEM HEALTH</text>
      </g>

      <!-- Panel 2: CI Status -->
      <g id="ci-status">
        <g id="ci-segments">
          <rect x="180" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="202" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="224" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="246" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="268" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="290" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="312" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="334" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="356" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
          <rect x="378" y="25" width="20" height="20" rx="2" fill="var(--text-dim)" opacity="0.2" />
        </g>
        <text id="ci-passrate" x="280" y="60" text-anchor="middle" font-size="9" fill="var(--text-dim)">0% (24h)</text>
        <text x="180" y="18" font-family="Orbitron" font-size="9" fill="var(--cyan)">CI STATUS</text>
      </g>

      <!-- Panel 3: PR Velocity -->
      <g id="pr-velocity">
        <text id="pr-opened" x="430" y="35" font-size="12" fill="var(--text-primary)">↑ 0 opened</text>
        <text id="pr-merged" x="510" y="35" font-size="12" fill="var(--text-primary)">← 0 merged</text>
        <text id="pr-rate" x="530" y="55" text-anchor="middle" font-size="9" fill="var(--text-dim)">0%</text>
        <text x="430" y="18" font-family="Orbitron" font-size="9" fill="var(--cyan)">PR VELOCITY</text>
      </g>

      <!-- Panel 4: Alerts -->
      <g id="alerts">
        <text id="alert-count" x="740" y="40" text-anchor="middle" class="data" font-size="24" fill="var(--cyan)">0</text>
        <text id="alert-label" x="740" y="58" text-anchor="middle" font-size="10" fill="var(--text-dim)">CLEAR</text>
        <text x="660" y="18" font-family="Orbitron" font-size="9" fill="var(--cyan)">ALERTS</text>
      </g>

      <!-- Panel 5: Connection -->
      <g id="connection">
        <circle id="conn-dot" cx="1350" cy="35" r="6" fill="var(--red)" />
        <text id="conn-label" x="1365" y="40" font-size="10" fill="var(--text-dim)">OFFLINE</text>
      </g>
    </g>

    <!-- Pipeline Zone (x=0, y=70, w=200, h=720) -->
    <g id="pipeline-zone">
      <rect x="0" y="70" width="200" height="720" fill="var(--bg-secondary)" />
      <line x1="200" y1="70" x2="200" y2="790" stroke="var(--cyan)" stroke-opacity="0.2" />
      <text x="100" y="88" text-anchor="middle" font-family="Orbitron" font-size="10" fill="var(--cyan)">PIPELINE</text>
      <!-- Label filter panel — positioned below DONE node -->
      <foreignObject x="4" y="665" width="192" height="140" id="label-filter-fo">
        <div xmlns="http://www.w3.org/1999/xhtml" id="label-filter-panel" style="
          background:rgba(13,13,26,0.95);
          border:1px solid rgba(0,212,255,0.2);
          border-radius:4px;
          padding:6px 8px;
          font-size:8px;
          overflow:hidden;
        "></div>
      </foreignObject>
      <!-- Pipeline nodes will be created dynamically -->
    </g>

    <!-- Agent Grid Zone (x=200, y=70, w=700, h=720) -->
    <g id="agent-grid-zone">
      <rect x="200" y="70" width="700" height="720" fill="var(--bg-primary)" />

      <!-- ZeusOps Pipeline Section -->
      <g id="zeusops-section">
        <line x1="200" y1="70" x2="900" y2="70" stroke="var(--cyan)" stroke-opacity="0.3" stroke-width="1" />
        <text x="210" y="88" font-family="Orbitron" font-size="9" fill="var(--cyan)">ZEUSOPS PIPELINE</text>

        <!-- Spawn lines layer (behind tiles) -->
        <g id="spawn-lines"></g>

        <!-- Agent tiles will be created dynamically -->
        <g id="agent-tiles"></g>
      </g>

      <!-- MC Gateway Section -->
      <g id="mc-gateway-section">
        <line x1="200" y1="650" x2="900" y2="650" stroke="var(--purple)" stroke-opacity="0.5" stroke-width="1" />
        <text x="210" y="668" font-family="Orbitron" font-size="9" fill="var(--purple)">MC GATEWAY</text>

        <g id="mc-dots">
          <!-- MC -->
          <circle id="mc-dot-main" cx="275" cy="700" r="6" fill="var(--text-dim)" />
          <text x="275" y="720" text-anchor="middle" font-size="9" fill="var(--text-dim)">MC</text>

          <!-- ZEUS⚡ -->
          <circle id="mc-dot-zeus" cx="450" cy="700" r="6" fill="var(--text-dim)" />
          <text x="450" y="720" text-anchor="middle" font-size="9" fill="var(--text-dim)">ZEUS⚡</text>

          <!-- TRAVIS -->
          <circle id="mc-dot-mctravis" cx="625" cy="700" r="6" fill="var(--text-dim)" />
          <text x="625" y="720" text-anchor="middle" font-size="9" fill="var(--text-dim)">TRAVIS</text>

          <!-- OBR -->
          <circle id="mc-dot-obr" cx="800" cy="700" r="6" fill="var(--text-dim)" />
          <text x="800" y="720" text-anchor="middle" font-size="9" fill="var(--text-dim)">OBR</text>
        </g>
      </g>
    </g>

    <!-- Activity Stream Zone (x=900, y=70, w=500, h=720) -->
    <g id="activity-zone">
      <rect x="900" y="70" width="500" height="720" fill="var(--bg-panel)" />
      <line x1="900" y1="70" x2="900" y2="790" stroke="var(--cyan)" stroke-opacity="0.2" />
      <text x="910" y="90" font-family="Orbitron" font-size="10" fill="var(--cyan)">ACTIVITY</text>

      <!-- Scrollable container using foreignObject -->
      <foreignObject x="900" y="100" width="500" height="690">
        <div xmlns="http://www.w3.org/1999/xhtml" class="activity-scroll" id="activity-scroll">
          <!-- Event cards will be inserted here -->
        </div>
      </foreignObject>
    </g>

    <!-- Tool Stream Zone (x=0, y=790, w=1400, h=110) -->
    <g id="tool-stream-zone">
      <line x1="0" y1="790" x2="1400" y2="790" stroke="var(--cyan)" stroke-opacity="0.2" />
      <text x="10" y="808" font-family="Orbitron" font-size="9" fill="var(--cyan)">TOOL STREAM</text>

      <foreignObject x="0" y="820" width="1400" height="80">
        <div xmlns="http://www.w3.org/1999/xhtml" class="tool-scroll" id="tool-scroll">
          <div style="text-align: center; padding: 20px; color: var(--text-dim); font-size: 10px;">NO RECENT TOOL ACTIVITY</div>
        </div>
      </foreignObject>
    </g>
  </svg>

  <script>
    // ============================================================================
    // DASHBOARD STATE
    // ============================================================================
    const DashboardState = {
      agents: {},        // agent_id → {status, lastSeen, currentJob, successRate, contextPct}
      agentStats: {},    // agent_id → {done7d, failed7d, lastResult, lastTask, runningJob}
      toolCalls: {},     // agent_id → [recent tool calls]
      handoffs: [],      // active handoffs between agents
      metrics: {
        healthScore: 0,
        ci: { passRate1h: 0, lastRuns: [], repos: {} },
        pr: { opened24h: 0, merged24h: 0 },
        pipeline: { backlog: 0, design: 0, code: 0, review: 0, done: 0 },
        pipelineByBoard: {},
        jobs: { completed24h: 0, successRate: 0 },
        alerts: { active: 0, escalations: [] }
      },
      events: [],        // ring buffer, max 100
      connected: false,
      lastUpdate: null
    };

    // ============================================================================
    // EVENT TYPE CONFIGURATION
    // ============================================================================
    const EVENT_COLORS = {
      dispatch:         "#00D4FF",  // cyan
      agent_checkpoint: "#00FF88",  // green
      ci_check:         null,       // green if success, red if failure (from context.result)
      pr_event:         "#7B68EE",  // purple
      trello_update:    "#00D4FF",  // cyan
      deploy:           "#00FF88",  // green
      heartbeat:        "#4A7A8A",  // dim
      escalation:       "#FF0040",  // RED — large card
      sre_alert:        "#FFB000",  // AMBER — large card
      wip_violation:    "#FF0040",  // RED — large card
      manager_alert:    "#FF0040",  // RED — large card
      scrum_alert:      "#FFB000",  // AMBER — large card
      scrum_check:      "#FFB000",  // amber
      system:           "#4A7A8A",  // dim
      tool_call:        "#4A7A8A",  // dim
    };

    const ALERT_TYPES = ["escalation", "sre_alert", "wip_violation", "manager_alert", "scrum_alert"];

    // ============================================================================
    // AGENT CONFIGURATION
    // ============================================================================
    const ZEUSOPS_AGENTS = [
      // Row 1
      { id: "manager", label: "Manager", x: 287, y: 135 },
      { id: "architect", label: "Architect", x: 462, y: 135 },
      { id: "researcher", label: "Researcher", x: 637, y: 135 },
      { id: "coder", label: "Coder", x: 812, y: 135 },
      // Row 2
      { id: "tester", label: "Tester", x: 287, y: 265 },
      { id: "reviewer", label: "Reviewer", x: 462, y: 265 },
      { id: "releaser", label: "Releaser", x: 637, y: 265 },
      { id: "pm", label: "PM", x: 812, y: 265 },
      // Row 3
      { id: "sre", label: "SRE", x: 287, y: 395 },
      { id: "incident-manager", label: "Incident Mgr", x: 462, y: 395 },
      { id: "workflow-architect", label: "Workflow Arch", x: 637, y: 395 },
      { id: "devops-automator", label: "DevOps", x: 812, y: 395 },
      // Row 4
      { id: "security", label: "Security", x: 287, y: 525 },
      { id: "tiger-team", label: "Tiger Team", x: 462, y: 525 }
    ];

    const AGENT_LOOKUP = Object.fromEntries(ZEUSOPS_AGENTS.map(a => [a.id, a]));

    // ============================================================================
    // HEALTH SCORE COMPUTATION
    // ============================================================================
    function computeHealthScore(state) {
      const agents = Object.values(state.agents);
      const total = agents.length || 1;
      const active = agents.filter(a => a.status === "active").length;
      const agentScore = active / total;

      const runs = state.metrics.ci.lastRuns.slice(-10);
      const ciScore = runs.length ? runs.filter(r => r === "success").length / runs.length : 1;

      const jobs = state.metrics.jobs;
      const jobScore = jobs.completed24h > 0 ? jobs.successRate : 1;

      const alerts = state.metrics.alerts.active;
      const alertScore = alerts === 0 ? 1 : Math.max(0, 1 - (alerts * 0.25));

      return Math.round((agentScore * 0.20 + ciScore * 0.30 + jobScore * 0.25 + alertScore * 0.25) * 100);
    }

    // ============================================================================
    // BOTTLENECK DETECTION
    // ============================================================================
    function detectBottlenecks(pipeline) {
      const stages = ["backlog", "design", "code", "review"];
      const next = {backlog:"design", design:"code", code:"review", review:"done"};
      const result = new Set();
      for (const s of stages) {
        if (pipeline[s] > 2 && pipeline[s] > (pipeline[next[s]] || 0) * 2) {
          result.add(s);
        }
      }
      return result;
    }

    // ============================================================================
    // BUILD FUNCTIONS (create SVG structure)
    // ============================================================================
    function buildPipeline() {
      const zone = document.getElementById('pipeline-zone');
      const stages = [
        { key: 'backlog', label: 'BACKLOG', y: 120 },
        { key: 'design', label: 'DESIGN', y: 240 },
        { key: 'code', label: 'CODE', y: 360 },
        { key: 'review', label: 'REVIEW', y: 480 },
        { key: 'done', label: 'DONE', y: 600 }
      ];

      stages.forEach((stage, i) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("id", `pipeline-${stage.key}`);

        // Node rect
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", "20");
        rect.setAttribute("y", stage.y);
        rect.setAttribute("width", "160");
        rect.setAttribute("height", "60");
        rect.setAttribute("rx", "8");
        rect.setAttribute("fill", "var(--bg-panel)");
        rect.setAttribute("stroke", "var(--cyan)");
        rect.setAttribute("stroke-width", "1");
        g.appendChild(rect);

        // Count
        const count = document.createElementNS("http://www.w3.org/2000/svg", "text");
        count.setAttribute("id", `pipeline-${stage.key}-count`);
        count.setAttribute("x", "100");
        count.setAttribute("y", stage.y + 32);
        count.setAttribute("text-anchor", "middle");
        count.setAttribute("font-family", "Orbitron");
        count.setAttribute("font-size", "24");
        count.setAttribute("fill", "var(--cyan)");
        count.textContent = "0";
        g.appendChild(count);

        // Label
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", "100");
        label.setAttribute("y", stage.y + 50);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("font-family", "Share Tech Mono");
        label.setAttribute("font-size", "10");
        label.setAttribute("fill", "var(--text-dim)");
        label.textContent = stage.label;
        g.appendChild(label);

        zone.appendChild(g);

        // Connector line to next stage
        if (i < stages.length - 1) {
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", "100");
          line.setAttribute("y1", stage.y + 60);
          line.setAttribute("x2", "100");
          line.setAttribute("y2", stages[i + 1].y);
          line.setAttribute("stroke", "var(--cyan)");
          line.setAttribute("stroke-width", "1");
          line.setAttribute("stroke-dasharray", "6,4");
          line.setAttribute("opacity", "0.3");
          zone.appendChild(line);
        }
      });
    }

    function buildAgentGrid() {
      const tilesGroup = document.getElementById('agent-tiles');

      ZEUSOPS_AGENTS.forEach(agent => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("id", `agent-${agent.id}`);
        g.setAttribute("class", "glow-dim");

        // Hexagon
        const hex = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        const points = createHexPoints(agent.x, agent.y, 50);
        hex.setAttribute("points", points);
        hex.setAttribute("fill", "var(--bg-panel)");
        hex.setAttribute("stroke", "var(--cyan)");
        hex.setAttribute("stroke-width", "1");
        g.appendChild(hex);

        // Agent name
        const name = document.createElementNS("http://www.w3.org/2000/svg", "text");
        name.setAttribute("x", agent.x);
        name.setAttribute("y", agent.y);
        name.setAttribute("text-anchor", "middle");
        name.setAttribute("font-family", "Orbitron");
        name.setAttribute("font-size", "9");
        name.setAttribute("fill", "var(--text-primary)");
        name.textContent = agent.label;
        g.appendChild(name);

        // Status dot (bottom-left)
        const statusDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        statusDot.setAttribute("id", `agent-${agent.id}-status`);
        statusDot.setAttribute("cx", agent.x - 35);
        statusDot.setAttribute("cy", agent.y + 30);
        statusDot.setAttribute("r", "4");
        statusDot.setAttribute("fill", "var(--text-dim)");
        g.appendChild(statusDot);

        // Performance badge (top-right)
        const perfBadge = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        perfBadge.setAttribute("id", `agent-${agent.id}-perf`);
        perfBadge.setAttribute("cx", agent.x + 35);
        perfBadge.setAttribute("cy", agent.y - 30);
        perfBadge.setAttribute("r", "3");
        perfBadge.setAttribute("fill", "var(--green)");
        g.appendChild(perfBadge);

        // Context bar (bottom of hex)

    function createHexPoints(cx, cy, size) {
      const points = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 2;
        const x = cx + size * Math.cos(angle);
        const y = cy + size * Math.sin(angle);
        points.push(`${x},${y}`);
      }
      return points.join(' ');
    }

    function renderCommandBar() {
      const state = DashboardState;
      const health = state.metrics.healthScore;

      // Panel 1: System Health
      const healthScore = document.getElementById('health-score');
      const healthRing = document.getElementById('health-ring');
      const healthPulse = document.getElementById('health-pulse');

      if (healthScore) healthScore.textContent = health;

      let healthColor = 'var(--green)';
      if (health < 60) healthColor = 'var(--red)';
      else if (health < 80) healthColor = 'var(--amber)';

      if (healthScore) healthScore.setAttribute('fill', healthColor);
      if (healthRing) healthRing.setAttribute('stroke', healthColor);
      if (healthPulse) healthPulse.setAttribute('stroke', healthColor);

      // Panel 2: CI Status
      const ciRuns = state.metrics.ci.lastRuns.slice(-10);
      const ciSegments = document.querySelectorAll('#ci-segments rect');

      ciSegments.forEach((seg, i) => {
        if (i < ciRuns.length) {
          const status = ciRuns[ciRuns.length - 1 - i]; // Reverse order
          let color = 'var(--text-dim)';
          let opacity = '0.2';

          if (status === 'success') {
            color = 'var(--green)';
            opacity = '0.8';
          } else if (status === 'failure') {
            color = 'var(--red)';
            opacity = '0.8';
          }

          seg.setAttribute('fill', color);
          seg.setAttribute('opacity', opacity);
        } else {
          seg.setAttribute('fill', 'var(--text-dim)');
          seg.setAttribute('opacity', '0.2');
        }
      });

      const successCount = ciRuns.filter(r => r === 'success').length;
      const passRate = ciRuns.length > 0 ? Math.round((successCount / ciRuns.length) * 100) : 0;
      const ciPassrate = document.getElementById('ci-passrate');
      if (ciPassrate) ciPassrate.textContent = `${passRate}% (24h)`;

      // Panel 3: PR Velocity
      const prOpened = document.getElementById('pr-opened');
      const prMerged = document.getElementById('pr-merged');
      const prRate = document.getElementById('pr-rate');

      if (prOpened) prOpened.textContent = `↑ ${state.metrics.pr.opened24h} opened`;
      if (prMerged) prMerged.textContent = `← ${state.metrics.pr.merged24h} merged`;

      const mergeRate = state.metrics.pr.opened24h > 0
        ? Math.round((state.metrics.pr.merged24h / state.metrics.pr.opened24h) * 100)
        : 0;
      if (prRate) prRate.textContent = `${mergeRate}%`;

      // Panel 4: Alerts
      const alertCount = document.getElementById('alert-count');
      const alertLabel = document.getElementById('alert-label');
      const activeAlerts = state.metrics.alerts.active;

      if (alertCount) {
        alertCount.textContent = activeAlerts;
        alertCount.setAttribute('fill', activeAlerts > 0 ? 'var(--red)' : 'var(--cyan)');
      }
      if (alertLabel) alertLabel.textContent = activeAlerts === 0 ? 'CLEAR' : 'ALERTS';

      // Panel 5: Connection
      updateConnectionIndicator();
    }

        const midY = (fromAgent.y + toAgent.y) / 2 - 30; // Control point offset
        const d = `M ${fromAgent.x} ${fromAgent.y} Q ${midX} ${midY} ${toAgent.x} ${toAgent.y}`;

    function contextPreview(action_type, ctx) {
      if (!ctx || Object.keys(ctx).length === 0) return "";
      switch(action_type) {
        case "dispatch":   return `agent: ${ctx.agent} | task: ${(ctx.task||"").slice(0,30)}`;
        case "ci_check":   return `${ctx.repo} | branch: ${ctx.branch} | ${ctx.duration_s}s`;
        case "pr_event":   return `${ctx.repo} PR#${ctx.pr_number} | ${ctx.action}`;
        case "escalation": return `severity: ${ctx.severity} | ${JSON.stringify(ctx).slice(0,60)}`;
        case "wip_violation": return `doing: ${ctx.current_wip||ctx.doing_count} | limit: ${ctx.limit||2}`;
        case "sre_alert":  return `${ctx.severity} | ${ctx.issue||ctx.service}`;
        case "deploy":     return `${ctx.environment} | ${ctx.service} | ${ctx.result}`;
        default: return Object.entries(ctx).slice(0,2).map(([k,v])=>`${k}: ${v}`).join(" | ");
      }
    }

    function appendToEventStream(record) {
      const container = document.getElementById('activity-scroll');
      if (!container) return;

      // Add to state (ring buffer)
      DashboardState.events.unshift(record);
      if (DashboardState.events.length > 100) DashboardState.events.pop();

      const action_type = record.action_type || record.status || 'system';
      const isAlert = ALERT_TYPES.includes(action_type);

      let ctx = {};
      try {
        ctx = (() => { try { const c = record.context; if (!c) return {}; if (typeof c === "object") return c; return JSON.parse(c); } catch(e) { return {}; } })();
      } catch(e) {
        ctx = {};
      }

      let color = EVENT_COLORS[action_type] || 'var(--cyan)';

      // Special case: ci_check color depends on result
      if (action_type === 'ci_check') {
        color = ctx.result === 'success' ? 'var(--green)' : 'var(--red)';
      }

      const ts = record.created ? new Date(record.created).toLocaleTimeString('en-US', { hour12: false }) : '';
      const desc = record.description || record.task_summary || 
        (ctx && Object.keys(ctx).length > 0 ? Object.entries(ctx).slice(0,2).map(([k,v])=>`${k}: ${v}`).join(' | ') : '') ||
        record.action_type || 'System event';
      const preview = contextPreview(action_type, ctx);

      // Check if fresh (< 60s old)
      const isFresh = record.created && (Date.now() - new Date(record.created).getTime()) < 60000;

      const card = document.createElement('div');
      card.className = 'event-card';
      if (isAlert) {
        card.classList.add('alert-card');
        if (color === 'var(--red)' || color === '#FF0040') card.classList.add('alert-red');
        else card.classList.add('alert-amber');
        if (isFresh) card.classList.add('fresh-alert');
      }
      card.style.borderLeftColor = color;

      card.innerHTML = `
        <div>
          <span class="event-badge" style="background-color: ${color}; color: #000;">${action_type.toUpperCase()}</span>
          <span class="event-time">${ts}</span>
        </div>
        <div class="event-desc">${desc}</div>
        <div class="event-context">${preview}</div>
      `;

      card.addEventListener('click', () => {
        showEventDetail(record, action_type, color);
      });

      container.insertBefore(card, container.firstChild);
    }

    function wrapText(text, maxChars) {
      const words = text.split(' ');
      const lines = [];
      let currentLine = '';

      for (const word of words) {
        if ((currentLine + word).length <= maxChars) {
          currentLine += (currentLine ? ' ' : '') + word;
        } else {
          if (currentLine) lines.push(currentLine);
          currentLine = word;
        }
      }
      if (currentLine) lines.push(currentLine);

      return lines.length > 0 ? lines : [''];
    }

    async function seedActivityStream() {
      try {
        const r = await fetch(`http://${window.location.hostname}:8878/events/recent`);
        if (!r.ok) return;
        const events = await r.json();

        for (const ev of events) {
          appendToEventStream(ev);
        }
        console.log('[ActivityStream] Seeded with', events.length, 'events');
      } catch(e) {
        console.warn('[ActivityStream] Failed to seed:', e);
      }
    }

    // ============================================================================
    // SSE CONNECTION
    // ============================================================================
    let eventSource = null;

    function connectSSE() {
      try {
        eventSource = new EventSource("http://" + window.location.hostname + ":8878/events/stream");

        eventSource.onopen = () => {
          console.log('[SSE] Connected');
          DashboardState.connected = true;
          updateConnectionIndicator();
          renderCommandBar();
        };

        eventSource.onmessage = (e) => {
          try {
            const event = JSON.parse(e.data);
            handleSSEEvent(event);
          } catch (err) {
            console.warn('[SSE] Failed to parse event:', err);
          }
        };

        eventSource.onerror = (err) => {
          console.warn('[SSE] Connection error:', err);
          DashboardState.connected = false;
          updateConnectionIndicator();

          if (eventSource) {
            eventSource.close();
          }

          setTimeout(connectSSE, 5000);
        };
      } catch (err) {
        console.error('[SSE] Failed to connect:', err);
        setTimeout(connectSSE, 5000);
      }
    }

    function handleSSEEvent(data) {
      const record = data.record || data;
      const collection = data.collection;

      // Handle agent_jobs SSE events
      if (collection === "agent_jobs" && record.agent_name) {
        const agentId = record.agent_name;
        if (!DashboardState.agentStats[agentId]) {
          DashboardState.agentStats[agentId] = {
            done7d: 0,
            failed7d: 0,
            lastResult: null,
            lastTask: null,
            runningJob: null
          };
        }
        const stats = DashboardState.agentStats[agentId];

        if (record.status === "running") {
          stats.runningJob = record;
          stats.lastTask = record.task_summary;
        } else if (record.status === "done") {
          stats.done7d++;
          stats.lastResult = "done";
          stats.runningJob = null;
          stats.lastTask = record.task_summary;
        } else if (record.status === "failed") {
          stats.failed7d++;
          stats.lastResult = "failed";
          stats.runningJob = null;
          stats.lastTask = record.task_summary;
        }

        renderAgentGrid();
        appendToEventStream(record);
        return;
      }

      // Skip PB handshake/subscription events — only process real collection records
      if (!record || !record.action_type) {
        return;  // silently ignore — not a manager_log or agent_jobs record
      }

      const ctx = typeof record.context === "string"
        ? JSON.parse(record.context || "{}")
        : (record.context || {});

      switch(record.action_type) {
        case "pr_event":
          if (ctx.action === "opened") DashboardState.metrics.pr.opened24h++;
          if (ctx.action === "merged") DashboardState.metrics.pr.merged24h++;
          break;
        case "escalation":
        case "sre_alert":
          if (!ctx.resolved) DashboardState.metrics.alerts.active++;
          break;
      }

      DashboardState.metrics.healthScore = computeHealthScore(DashboardState);
      renderCommandBar();
      renderPipeline();
      appendToEventStream(record);
    }

    // ============================================================================
    // DATA POLLING
    // ============================================================================
    async function pollAgentData() {
      try {
        const r = await fetch("http://" + window.location.hostname + ":8878/data");
        const d = await r.json();

        if (d.agents) {
          for (const agent of d.agents) {
            DashboardState.agents[agent.id] = {
              status: agent.status || 'offline',
              lastActive: agent.lastActive,
              contextPct: agent.contextPct || 0,
              totalTokens: agent.totalTokens || 0,
              model: agent.model,
              sessionCount: agent.sessionCount || 0
            };
          }
        }

        if (d.stats) {
          DashboardState.stats = d.stats;
        }

        DashboardState.handoffs = d.handoffs || [];

        DashboardState.metrics.healthScore = computeHealthScore(DashboardState);
        renderCommandBar();
        renderAgentGrid();
        renderSpawnLines();

        DashboardState.lastUpdate = Date.now();
      } catch(e) {
        console.warn('[data] poll failed', e);
      }
    }

    async function pollCI() {
      try {
        const r = await fetch("http://" + window.location.hostname + ":8878/ci");
        const d = await r.json();
        const allRuns = [];

        for (const repo of Object.values(d.repos || {})) {
          for (const run of (repo.recentRuns || [])) {
            allRuns.push({status: run.status, ts: run.created_at});
          }
        }

        allRuns.sort((a,b) => new Date(b.ts) - new Date(a.ts));
        DashboardState.metrics.ci.lastRuns = allRuns.slice(0,10).map(r => r.status);
        DashboardState.metrics.ci.repos = d.repos;

        DashboardState.metrics.healthScore = computeHealthScore(DashboardState);
        renderCommandBar();

        console.log('[CI] Updated:', allRuns.length, 'runs');
      } catch(e) {
        console.warn('[CI] poll failed', e);
      }
    }

    async function pollTrello() {
      try {
        const r = await fetch("http://" + window.location.hostname + ":8878/trello");
        const d = await r.json();

        // Store all cards with label data for filtering
        DashboardState.trelloCards = d.cards || {};  // {boardName: [{id,name,list,labels}]}

        // Load available labels if not yet loaded
        if (DashboardState.labelFilter.availableLabels.length === 0) {
          try {
            const lr = await fetch("http://" + window.location.hostname + ":8878/trello/labels");
            const labels = await lr.json();
            DashboardState.labelFilter.availableLabels = labels;
            // Restore persisted filter from localStorage
            const saved = localStorage.getItem('zeusops-label-filter');
            if (saved) {
              const parsed = JSON.parse(saved);
              DashboardState.labelFilter.enabled = parsed.enabled || false;
              DashboardState.labelFilter.selectedIds = parsed.selectedIds || [];
            }
            renderLabelFilter();
          } catch(e) { console.warn('[labels] failed', e); }
        }

        // Compute pipeline counts — apply label filter if enabled
        const p = computePipelineCounts(d);
        DashboardState.metrics.pipeline = p;
        DashboardState.metrics.pipelineByBoard = d.boards;
        renderCommandBar();
        renderPipeline();

        console.log('[Trello] Updated:', p);
      } catch(e) {
        console.warn('[Trello] poll failed', e);
      }
    }

    function computePipelineCounts(d) {
      const filter = DashboardState.labelFilter;
      const p = {backlog:0, design:0, code:0, review:0, done:0};

      // If filter disabled or no selection — use raw counts
      if (!filter.enabled || filter.selectedIds.length === 0) {
        for (const board of Object.values(d.boards || {})) {
          p.backlog += board["Backlog"] || 0;
          p.design  += board["Design"] || 0;
          p.code    += board["Code/Test"] || board["Code"] || board["🚧 In Progress"] || 0;
          p.review  += board["Review"] || board["👀 Awaiting Approval"] || 0;
          p.done    += board["Done"] || 0;
        }
        return p;
      }

      // Filter enabled — count only cards with matching labels
      const selectedSet = new Set(filter.selectedIds);
      const allCards = DashboardState.trelloCards || {};

      for (const boardCards of Object.values(allCards)) {
        for (const card of boardCards) {
          const cardLabelIds = (card.labels || []).map(l => l.id);
          const matches = cardLabelIds.some(id => selectedSet.has(id));
          if (!matches) continue;
          switch(card.list) {
            case "Backlog":   p.backlog++; break;
            case "Design":    p.design++;  break;
            case "Code/Test": p.code++;    break;
            case "Review":    p.review++;  break;
            case "Done":      p.done++;    break;
          }
        }
      }
      return p;
    }

    function renderLabelFilter() {
      const container = document.getElementById('label-filter-panel');
      if (!container) return;
      const filter = DashboardState.labelFilter;
      const labels = filter.availableLabels;

      container.innerHTML = '';

      // Filter toggle header
      const header = document.createElement('div');
      header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;cursor:pointer;';
      const activeCount = filter.selectedIds.length;
      header.innerHTML = `
        <span style="font-family:Orbitron,monospace;font-size:8px;color:var(--cyan);">FILTER</span>
        <span style="font-family:Share Tech Mono,monospace;font-size:8px;color:${filter.enabled && activeCount > 0 ? 'var(--amber)' : 'var(--text-dim)'};">
          ${filter.enabled && activeCount > 0 ? activeCount + ' active' : 'ALL'}
        </span>`;
      header.onclick = () => {
        const body = document.getElementById('label-filter-body');
        if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
      };
      container.appendChild(header);

      // Filter body (collapsible)
      const body = document.createElement('div');
      body.id = 'label-filter-body';
      body.style.cssText = 'display:none;';

      // Enable toggle
      const enableRow = document.createElement('div');
      enableRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer;';
      enableRow.innerHTML = `
        <div style="width:10px;height:10px;border:1px solid var(--cyan);background:${filter.enabled ? 'var(--cyan)' : 'transparent'};border-radius:2px;"></div>
        <span style="font-family:Share Tech Mono,monospace;font-size:8px;color:var(--text-primary);">Enable filter</span>`;
      enableRow.onclick = () => {
        filter.enabled = !filter.enabled;
        saveFilter();
        const p = computePipelineCounts({boards: DashboardState.metrics.pipelineByBoard || {}, cards: DashboardState.trelloCards || {}});
        DashboardState.metrics.pipeline = p;
        renderLabelFilter();
        renderPipeline();
        renderCommandBar();
      };
      body.appendChild(enableRow);

      // Separator
      const sep = document.createElement('div');
      sep.style.cssText = 'border-top:1px solid var(--border);margin:4px 0;';
      body.appendChild(sep);

      // Label checkboxes
      if (labels.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-family:Share Tech Mono,monospace;font-size:7px;color:var(--text-dim);';
        empty.textContent = 'Loading labels...';
        body.appendChild(empty);
      }

      // Color map for TRON-ish display
      const colorMap = {red:'#FF0040', green:'#00FF88', blue:'#5BA4CF', orange:'#FFB000',
                        yellow:'#F5DD29', purple:'#9B59B6', pink:'#FF78CB', sky:'#29CCE5',
                        lime:'#51E898', black:'#4A7A8A', green_light:'#00FF88', red_light:'#FF6B6B'};

      for (const label of labels) {
        if (!label.name) continue;
        const isSelected = filter.selectedIds.includes(label.id);
        const dotColor = colorMap[label.color] || 'var(--cyan)';

        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer;padding:2px 0;';
        row.innerHTML = `
          <div style="width:10px;height:10px;border:1px solid ${dotColor};background:${isSelected ? dotColor : 'transparent'};border-radius:2px;flex-shrink:0;"></div>
          <div style="width:6px;height:6px;border-radius:50%;background:${dotColor};flex-shrink:0;"></div>
          <span style="font-family:Share Tech Mono,monospace;font-size:8px;color:${isSelected ? 'var(--text-primary)' : 'var(--text-dim)'};">${label.name}</span>`;
        row.onclick = () => {
          if (filter.selectedIds.includes(label.id)) {
            filter.selectedIds = filter.selectedIds.filter(id => id !== label.id);
          } else {
            filter.selectedIds.push(label.id);
          }
          saveFilter();
          const p = computePipelineCounts({boards: DashboardState.metrics.pipelineByBoard || {}, cards: DashboardState.trelloCards || {}});
          DashboardState.metrics.pipeline = p;
          renderLabelFilter();
          renderPipeline();
          renderCommandBar();
        };
        body.appendChild(row);
      }

      // Clear button
      if (filter.selectedIds.length > 0) {
        const clear = document.createElement('div');
        clear.style.cssText = 'margin-top:6px;font-family:Share Tech Mono,monospace;font-size:7px;color:var(--text-dim);cursor:pointer;text-decoration:underline;';
        clear.textContent = 'Clear all';
        clear.onclick = () => {
          filter.selectedIds = [];
          saveFilter();
          const p = computePipelineCounts({boards: DashboardState.metrics.pipelineByBoard || {}, cards: DashboardState.trelloCards || {}});
          DashboardState.metrics.pipeline = p;
          renderLabelFilter();
          renderPipeline();
          renderCommandBar();
        };
        body.appendChild(clear);
      }

      container.appendChild(body);
    }

    function saveFilter() {
      localStorage.setItem('zeusops-label-filter', JSON.stringify({
        enabled: DashboardState.labelFilter.enabled,
        selectedIds: DashboardState.labelFilter.selectedIds
      }));
    }

    async function pollTools() {
      try {
        const r = await fetch("http://" + window.location.hostname + ":8878/tools");
        const calls = await r.json();

        const byAgent = {};
        for (const call of calls) {
          if (!byAgent[call.agent]) byAgent[call.agent] = [];
          byAgent[call.agent].push(call);
        }

        for (const agent in byAgent) {
          byAgent[agent] = byAgent[agent].slice(-3);
        }

        DashboardState.toolCalls = byAgent;
        renderAgentGrid();
        renderToolStream();

        console.log('[tools]', calls.length, 'calls');
      } catch(e) {
        console.warn('[tools] poll failed', e);
      }
    }

    // ============================================================================
    // MASTER RENDER FUNCTION
    // ============================================================================
    function render() {
      renderCommandBar();
      renderPipeline();
      renderAgentGrid();
      renderSpawnLines();
      renderToolStream();
    }

    // ============================================================================
    // INITIALIZATION
    // ============================================================================
    async function initDashboard() {
      console.log('[Dashboard] Initializing...');

      // Build SVG structure
      buildPipeline();
      renderLabelFilter();
      buildAgentGrid();
      buildActivityStream();
      buildToolStream();
      buildCommandBar();

      // Seed data — await all polls before first render
      await Promise.allSettled([pollAgentData(), pollCI(), pollTrello()]);

      // Force renders after data loaded
      render();

      // Seed activity stream
      await seedActivityStream();

      // Start SSE
      connectSSE();

      // Polling intervals
      setInterval(pollAgentData, 5000);
      setInterval(pollTools, 8000);
      setInterval(pollCI, 30000);
      setInterval(pollTrello, 300000);

      console.log('[Dashboard] Initialization complete');
    }

    // Start the dashboard
    initDashboard();
  </script>
</body>
</html>
